apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: llm-observability
  labels: { app: ingestion-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingestion-service }
  template:
    metadata:
      labels: { app: ingestion-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: ingestion-service
          image: llm-obs/ingestion-service:0.1.0
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef: { name: platform-config }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8002 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits: { cpu: "750m", memory: "384Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: llm-observability
  labels: { app: ingestion-service }
spec:
  selector: { app: ingestion-service }
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service
  namespace: llm-observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-service
  # Cap at the topic partition count (3) — extra consumers would idle.
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 75 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingestion-service
  namespace: llm-observability
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ingestion-service }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingestion-service
  namespace: llm-observability
spec:
  podSelector:
    matchLabels: { app: ingestion-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 8002 }
