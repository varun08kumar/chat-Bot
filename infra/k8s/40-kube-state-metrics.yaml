# Minimal kube-state-metrics deployment so Prometheus/Grafana can graph HPA
# replica counts (kube_horizontalpodautoscaler_status_*) and deployment pod
# counts (kube_deployment_status_replicas). Exposed via NodePort so the
# Docker-Compose Prometheus (joined to the "kind" network) can scrape it
# without any host port-forwarding.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: ["", "apps", "autoscaling", "batch", "policy"]
    resources: ["pods", "deployments", "replicasets", "horizontalpodautoscalers", "nodes", "namespaces"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: kube-state-metrics }
  template:
    metadata:
      labels: { app: kube-state-metrics }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - containerPort: 8080
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: kube-system
spec:
  type: NodePort
  selector: { app: kube-state-metrics }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
