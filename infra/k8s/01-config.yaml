apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: llm-observability
data:
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  REDIS_URL: "redis://redis:6379/0"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  # Postgres connection is assembled from these + the secret's password.
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "llm_observability"
  POSTGRES_USER: "postgres"
  # No TLS on this local kind ingress (30-ingress.yaml disables ssl-redirect),
  # so cookies must not be marked Secure or the browser would drop them.
  # Flip to "true" once a real TLS-terminating ingress is in front of this.
  COOKIE_SECURE: "false"
---
# NOTE: This is an EXAMPLE secret with placeholder values for local clusters.
# In production, provision it out-of-band (sealed-secrets / external-secrets /
# cloud secret manager). Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: llm-observability
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  # Full async DSN consumed by the services.
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/llm_observability"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
  # Signs access/refresh JWTs - replace with a real random value before
  # deploying anywhere beyond a local kind cluster.
  JWT_SECRET: "changeme-local-kind-cluster-only"
