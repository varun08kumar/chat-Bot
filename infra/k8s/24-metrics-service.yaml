apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: llm-observability
  labels: { app: metrics-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: metrics-service }
  template:
    metadata:
      labels: { app: metrics-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8004"
    spec:
      containers:
        - name: metrics-service
          image: llm-obs/metrics-service:0.1.0
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef: { name: platform-config }
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: platform-secrets, key: DATABASE_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: platform-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8004 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8004 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: llm-observability
  labels: { app: metrics-service }
spec:
  selector: { app: metrics-service }
  ports:
    - port: 8004
      targetPort: 8004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metrics-service
  namespace: llm-observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metrics-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metrics-service
  namespace: llm-observability
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: metrics-service }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-service
  namespace: llm-observability
spec:
  podSelector:
    matchLabels: { app: metrics-service }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - { protocol: TCP, port: 8004 }
