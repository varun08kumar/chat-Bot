name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Frontend: type-check + build (there's no eslint configured yet -
  # package.json's "lint" script is actually just `tsc --noEmit`). ---
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint   # tsc --noEmit
      - run: npm run build

  # --- Backend: every service's Dockerfile actually builds. There's no
  # ruff/mypy configured for the Python services yet (see pyproject.toml) -
  # this is the honest baseline until that's added. ---
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [chat-service, ingestion-service, consumer-service, metrics-service, frontend]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          tags: llm-obs/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Kubernetes manifests: kustomize builds cleanly and every resulting
  # object is schema-valid, without needing a live cluster. ---
  k8s-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: kubectl kustomize infra/k8s > /tmp/rendered.yaml
      - run: kubectl apply --dry-run=client -f /tmp/rendered.yaml --validate=true
        # --dry-run=client only needs the built-in OpenAPI schema, no cluster
        # required - this still catches typos/schema errors in the manifests.

  # --- Integration tests: bring up the real Compose stack and run the
  # non-destructive-to-CI subset of scripts/tests/. Skips 60_scaling_hpa.sh
  # (spins up its own kind cluster - too slow/heavy for a shared runner; run
  # that one locally or on a dedicated job if you want it in CI later).
  #
  # IMPORTANT: several scripts (16, 17, 18, 21 and others) make real chat
  # completions, which means they need a working LLM provider key. Add
  # GROQ_API_KEY (or swap for whichever provider you want CI to use) as a
  # repository secret, or these specific scripts will fail here for a
  # missing-credential reason, not a real bug - same thing we found testing
  # Claude/Gemini manually earlier.
  integration:
    runs-on: ubuntu-latest
    needs: [build-images]
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for the stack
        run: |
          cp .env.example .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)" >> .env

      - name: Start the stack
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env up -d --build

      - name: Wait for every service to report healthy
        run: |
          for port in 8001 8002 8003 8004; do
            for _ in $(seq 1 60); do
              curl -sf "http://localhost:$port/health" && break
              sleep 2
            done
          done

      - name: Run the fast/safe test suite
        working-directory: scripts/tests
        run: ./run_all.sh --skip-slow

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker/docker-compose.yml --env-file .env down -v
