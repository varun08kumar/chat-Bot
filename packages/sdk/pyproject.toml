[project]
name = "llm-obs-sdk"
version = "0.1.0"
description = "Automatic LLM inference instrumentation SDK (@observe_llm) for the observability platform"
requires-python = ">=3.11"
dependencies = [
    "llm-obs-shared",
    "aiokafka>=0.11",
    "pydantic>=2.7",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_obs_sdk*"]
