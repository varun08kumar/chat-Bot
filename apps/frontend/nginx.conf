# Nginx config for the built SPA. Serves static assets, routes /api to the
# chat service and /api/metrics to the metrics service, and proxies SSE with
# buffering disabled so tokens stream to the browser in real time.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS resolver, short TTL. A static `upstream {}` block
    # (or a bare proxy_pass hostname) resolves once at nginx startup and
    # caches that IP forever - any backend container restart (new IP on the
    # compose network) then 502s until nginx itself restarts. A *variable*
    # proxy_pass target forces re-resolution through this resolver instead.
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # More specific route first: dashboard APIs -> metrics service.
    location /api/metrics/ {
        # `set` must precede `rewrite ... break` - break halts further
        # rewrite-phase directive processing in this location, so a `set`
        # written after it never runs ("uninitialized variable" at runtime).
        set $metrics_upstream http://metrics-service:8004;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $metrics_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else under /api -> chat service (SSE-friendly).
    location /api/ {
        set $chat_upstream http://chat-service:8001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Hashed build assets (index-<hash>.js/css) are safe to cache forever —
    # a new build always produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy's hashed asset
    # references are picked up immediately, not served from a stale cache.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
