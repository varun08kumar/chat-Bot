[project]
name = "consumer-service"
version = "0.1.0"
description = "Persists processed inference events into PostgreSQL with batching, retries and a DLQ"
requires-python = ">=3.11"
dependencies = [
    "llm-obs-shared[db,kafka]",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
